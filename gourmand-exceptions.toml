
# Lint suppression — test intentionally passes invalid args to verify rejection
[[exceptions]]
check = "EV001-lint_suppression"
path = "tests/test_validation.py"
justification = "type: ignore[call-arg] is required to test that Pydantic rejects extra fields"
classification = "by_design"

[[exceptions]]
check = "CH006-primitive_obsession"
path = "src/mcp_gitlab_crunchtools/__init__.py"
justification = "Port 8000 is a standard default for HTTP servers"
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "src/mcp_gitlab_crunchtools/models.py"
justification = "encode_project_id and encode_group_id validate against different patterns with different error text before URL-encoding. GitLab treats project and group paths as separate namespaces and the messages need to say which one was wrong."
classification = "by_design"

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "src/mcp_gitlab_crunchtools/client.py"
justification = "get_client and get_config are both the four-line lazy-singleton accessor: check the module global, construct if None, return. The duplication is the idiom; hiding it behind a generic obscures which global is being initialised."
classification = "by_design"

[[exceptions]]
check = "CH001-absolute_paths"
path = "src/mcp_gitlab_crunchtools/tools/users.py"
justification = "The flagged literal is a GitLab REST API endpoint path (users-collection route with an interpolated id), appended to the configured base URL by the HTTP client -- not a filesystem path. CH001's system_path_pattern regex is compiled case-insensitively and includes the macOS capitalized home-directory convention for that same word; case-insensitivity makes it also match our lowercase API route spelled the same way. Confirmed by isolating this single line in a scratch project: it does not fire without that case-insensitive macOS pattern in play, and every one of this codebase's other 57 similar API path fragments (projects, groups, etc. routes) is unaffected because none of them happen to share a spelling with a listed system path."
classification = "gourmand_bug"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "src/mcp_gitlab_crunchtools/config.py"
justification = "GITLAB_SSL_VERIFY and SSL_CERT_FILE are real, intentional settings for self-hosted GitLab with an internal CA -- confirmed against config.py's Config.__init__ (os.environ.get(\"GITLAB_SSL_VERIFY\", \"true\") -> default \"true\"; os.environ.get(\"SSL_CERT_FILE\") with no fallback -> default None/not-set; both verified against this source, not a docstring). GITLAB_URL is not flagged here since it is already in EV013's own allowlist pattern set for this file (it was not part of the 9 violations). Documented by name, required/optional status, and default in README.md's Environment Variables table and CLAUDE.md. EV013 has no documentation detection of its own -- it only compares the var name against a fixed allowlist -- so this exception is the record that a human confirmed each is real and written down, defaults matching the actual code."
classification = "by_design"

[[exceptions]]
check = "EV013-hidden_env_config"
path = "tests/test_tools.py"
justification = "Tests set/read the same already-documented GITLAB_URL, GITLAB_SSL_VERIFY, and SSL_CERT_FILE (see the config.py exception above and README.md/CLAUDE.md) to exercise Config under test; these are not separate undocumented test-only toggles."
classification = "by_design"

[[exceptions]]
check = "EV002-manifest_lint_suppression"
path = "pyproject.toml"
justification = "Each remaining global ruff ignore was verified against this codebase with the project's own pinned toolchain (`uv run ruff check --select <RULE>`, ignore list temporarily cleared for an unmasked read) before being kept: TRY003 (6 src/ files, GitLab API error messages), PLR0913 (11 src/ files -- nearly every tools/ module -- MCP tool signatures mirror the wire API and genuinely take many named parameters), PLR2004 (client.py plus tests, HTTP status/size comparisons), PLW0603 (client.py + config.py, module-level lazy singletons), TID252 (14 src/ files, this package's own internal relative imports). Two previously-global entries with zero hits anywhere (PLR0917, S106) or fixable outright (PIE790: one redundant `pass` removed from errors.py; RUF022: unsorted `__all__` in tools/__init__.py) were resolved with `ruff check --fix` instead of kept ignored. S101 (assert), S105 (a literal secret value in test fixtures), and PLC0415 (importing the module/fixture under test inside the test body) were moved from the global ignore into `[tool.ruff.lint.per-file-ignores]` for tests/* -- all three fire only in tests/, never in src/."
classification = "by_design"
